name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more asks for it itself, so a
# compromised dependency in one step cannot push to the repository.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # No `ruff format --check` yet: nineteen files predate the formatter and
      # reformatting them belongs in its own commit, not in a lint gate that
      # would be red from the day it lands. pre-commit formats what a
      # contributor touches in the meantime.
      - name: ruff check
        run: ruff check src tests scripts clients

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The v0 slice is stdlib-only and the suite is offline and deterministic,
      # so the matrix proves exactly one thing: that the promise holds on every
      # interpreter and operating system the package claims to support.
      - name: Run the test suite
        run: pytest -q

  build:
    name: Package builds and installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build the wheel and sdist
        run: python -m build
      - name: Check the metadata
        run: twine check dist/*
      # An editable install hides packaging mistakes: it puts the working tree
      # on the path, so a module missing from the wheel still imports and a
      # broken console script still resolves.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import praxis; print(praxis.__name__)"
          # Every console script the package advertises has to resolve. A typo
          # in an entry point is invisible until a user types the command.
          /tmp/fresh/bin/praxis-demo --help > /dev/null
          /tmp/fresh/bin/praxis-ask --help > /dev/null
          /tmp/fresh/bin/praxis-eval --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker image builds and serves the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is the first instruction in the README, so a green tick that
      # cannot fail on a broken image is a green tick about something else. It
      # also covers the base image, which a Dependabot bump moves without any
      # other job noticing.
      - name: Build
        run: docker build -t praxis:ci .

      - name: Start
        run: docker run -d --name praxis-ci -p 8077:8077 praxis:ci

      # PRAXIS_OFFLINE=1 is set in the image, so nothing here needs a key, a GPU
      # or the network. First start is the slow one - the corpus is parsed - so
      # the wait is generous.
      - name: Wait for /health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8077/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container did not become healthy within 90s"
          docker logs praxis-ci
          exit 1

      # Liveness only proves uvicorn started. This proves the corpus that ships
      # inside the image can actually be read, which is what the offline
      # promise rests on.
      - name: Corpus is loaded
        run: |
          set -o pipefail
          stats=$(curl -sf http://localhost:8077/v1/stats) || {
            echo "::error::/v1/stats did not answer"
            docker logs praxis-ci
            exit 1
          }
          echo "$stats"
          python -c "
          import json, sys
          d = json.loads(sys.argv[1])
          total = sum(v for v in d.values() if isinstance(v, int))
          if total <= 0:
              sys.exit('the image reports an empty corpus: ' + sys.argv[1])
          print('corpus non-empty')
          " "$stats"

      - name: Container log on failure
        if: failure()
        run: docker logs praxis-ci || true

      - name: Stop
        if: always()
        run: docker rm -f praxis-ci || true

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, docker]
    steps:
      # One aggregate check to require in branch protection. Without it, adding
      # a job to the matrix silently leaves it unrequired, and a red job stops
      # blocking merges.
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks passed."
