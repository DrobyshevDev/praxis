name: Release

# Publishing is driven by a tag, so a release is always traceable to a commit:
#
#   git tag -a v0.0.1 -m "praxis 0.0.1" && git push origin v0.0.1
#
# No PyPI step, and that is not an omission. The name `praxis` on PyPI belongs
# to Google's PAX library and has since 2022 — publishing under it is not
# available, and squatting an adjacent name is a decision for a person, not for
# a workflow. Until a distribution name is chosen, this builds the wheel and the
# sdist and attaches them to the GitHub release, which is what `pip install`
# from a URL needs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check src tests scripts clients
          pytest -q

      # This repository already carries the mistake this check exists to stop:
      # tag v0.1.0 was pushed while pyproject.toml and praxis.__version__ both
      # say 0.0.1. Whichever number is right, they have to agree before the next
      # release, or the artefact advertises a version nobody can match to a
      # commit.
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import praxis; print(praxis.__version__)")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || {
            echo "::error::Tag v$TAG does not match praxis.__version__ ($PKG)."
            exit 1
          }

      - name: The changelog must mention this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          grep -q "^## $TAG" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## $TAG' section."
            exit 1
          }

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build

      - name: Check the metadata
        run: twine check --strict dist/*

      # The suite runs against the source tree, so a module missing from the
      # wheel passes every test and fails the first user. This is the only job
      # that would notice.
      - name: The wheel must work from a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import praxis; print(praxis.__version__)"
          /tmp/fresh/bin/praxis-demo --help > /dev/null
          /tmp/fresh/bin/praxis-ask --help > /dev/null
          /tmp/fresh/bin/praxis-eval --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: Attach the distributions to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The notes are written to a file rather than passed inline: they contain
      # backticks and a URL, and quoting both through a shell argument is the
      # kind of thing that works until the day it silently truncates.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WHEEL=$(basename dist/*.whl)
          cat > notes.md <<EOF
          Что изменилось — в [CHANGELOG.md](https://github.com/DrobyshevDev/praxis/blob/master/CHANGELOG.md).

          Пакета на PyPI нет: имя \`praxis\` там занято библиотекой Google из проекта PAX.
          Установка из этого релиза:

          \`\`\`bash
          pip install https://github.com/DrobyshevDev/praxis/releases/download/$TAG/$WHEEL
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* \
            --title "praxis ${TAG#v}" \
            --notes-file notes.md
