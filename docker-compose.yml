# Postgres + pgvector — схема индекса, который спроектирован, но не подключён.
#
# Ни одна строка Python здесь не соединяется с базой. Dense и hybrid работают на
# numpy в памяти (src/praxis/retrieve/dense.py) с кэшем векторов на диске, и
# заявленные в README метрики померены именно на нём. Сервис `db` поднимается и
# применяет schema.sql, чтобы схему можно было посмотреть и отладить; ретривера
# на psycopg ещё нет — см. issue #26.
#
# Порт 5434, чтобы не конфликтовать с ARC (5433).
services:
  # Приложение из коробки: без токенов, ключей и GPU (офлайн + полный корпус ГК).
  #   docker compose up app  ->  http://localhost:8077
  app:
    build: .
    ports:
      - "8077:8077"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "5434:5432"
    volumes:
      - praxis_pg:/var/lib/postgresql/data
      - ./src/praxis/index/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  praxis_pg:
