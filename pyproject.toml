[project]
name = "praxis"
version = "0.0.1"
description = "Юридический ассистент по праву РФ с проверяемыми цитатами"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []  # v0-срез (ingest + BM25) работает на чистой стандартной библиотеке

[project.optional-dependencies]
# Плотный поиск, reranker, NLI-верификатор — тяжёлые модели (ставятся отдельно).
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "FlagEmbedding>=1.2",
    "torch>=2.2",
]
# API-слой и реальный индекс.
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
llm = ["anthropic>=1.0.0"]
# Дистрибутив называется glia-agents: имя "glia" на PyPI занято чужим пакетом
# (Glial Engines, максимум 0.1.0.dev6). Импорт при этом остаётся `glia`.
agent = ["glia-agents>=0.8.2", "anthropic>=1.0.0"]  # glia-агент (LLM-режим), см. agent.glia_agent
desktop = ["pywebview>=6.2.1"]
eval = ["ragas>=0.4.3"]
dev = ["pytest>=9.1.1", "pytest-cov>=5.0", "ruff>=0.16.7", "mypy>=1.11"]

[project.scripts]
praxis-demo = "praxis.demo:main"
praxis-ask = "praxis.ask:main"
praxis-eval = "praxis.eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.mypy]
# The organisation's profile says everything here is typed. It was true of every
# repository except this one, which had no mypy at all -- 75% of its functions
# carried annotations and nothing checked them. Turning it on found ten errors,
# one of which was an annotation that contradicted the invariant its own
# docstring insists on (the reference graph is keyed by act *and* article, and
# the parameter said otherwise).
python_version = "3.11"
files = ["src/praxis"]
ignore_missing_imports = true

# Not disallow_untyped_defs yet: a third of the functions here are still
# unannotated, and a gate nobody can pass is a gate that gets deleted. This is
# the floor that holds today; raise it as the annotations land.
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Явный набор правил, чтобы линт не зависел от версии ruff (у новых версий шире дефолт).
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["praxis"]
branch = true

[tool.coverage.report]
# A floor to ratchet, not a claim. The suite is offline and deterministic, so
# the figure is stable run to run; raise this once the first report lands.
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
