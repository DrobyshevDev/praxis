[project]
name = "praxis"
version = "0.0.1"
description = "Юридический ассистент по праву РФ с проверяемыми цитатами"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []  # v0-срез (ingest + BM25) работает на чистой стандартной библиотеке

[project.optional-dependencies]
# Плотный поиск, reranker, NLI-верификатор — тяжёлые модели (ставятся отдельно).
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "FlagEmbedding>=1.2",
    "torch>=2.2",
]
# API-слой и реальный индекс.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.2",
]
llm = ["anthropic>=0.40"]
agent = ["glia>=0.8", "anthropic>=0.40"]  # glia-агент (LLM-режим), см. agent.glia_agent
desktop = ["pywebview>=6.2.1"]
eval = ["ragas>=0.4.3"]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]

[project.scripts]
praxis-demo = "praxis.demo:main"
praxis-ask = "praxis.ask:main"
praxis-eval = "praxis.eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Явный набор правил, чтобы линт не зависел от версии ruff (у новых версий шире дефолт).
select = ["E4", "E7", "E9", "F"]
